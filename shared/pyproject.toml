[project]
name = "fastapi-celery-shared"
version = "0.1.0"
description = "Shared utilities for FastAPI Celery AI pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Configuration and validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.0.0",
    
    # Logging
    "structlog>=25.4.0",
    
    # Utilities
    "tenacity>=9.1.2",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-dir]
"" = "."