version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fastapi-celery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fastapi-celery-network

  # Uncomment the following services when you want to run the full stack with Docker
  # You'll need to create Dockerfiles for each service first
  
  # api:
