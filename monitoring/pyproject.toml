[project]
name = "fastapi-celery-monitoring"
version = "0.1.0"
description = "Flower monitoring dashboard for Celery workers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Task Queue & Monitoring
    "celery>=5.5.3",
    "redis>=6.4.0",
    "flower>=2.0.1",
    
    # Configuration and validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.0.0",
    
    # Logging
    "structlog>=25.4.0",
    
    # Utilities
    "tenacity>=9.1.2",
]

# No build system needed for Upsun deployment