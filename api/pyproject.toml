[project]
name = "fastapi-celery-api"
version = "0.1.0"
description = "FastAPI web application for AI pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn>=0.35.0",
    
    # Task Queue Client
    "celery>=5.5.3",
    "redis>=6.4.0",
    
    # HTTP Clients
    "httpx>=0.28.1",
    
    # File Processing
    "python-multipart>=0.0.20",
    
    # Configuration and validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.0.0",
    
    # Logging
    "structlog>=25.4.0",
    
    # Utilities
    "tenacity>=9.1.2",
]

# No build system needed for Upsun deployment